name: CI - Verifica & Test HOUNIGO

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'work/**'
      - 'feat/**'
      - 'fix/**'
      - 'hotfix/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verifica, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ViaggiodiNozze/package-lock.json'

      - name: Install dependencies
        working-directory: ViaggiodiNozze
        run: npm ci

      - name: Esegui Lint (Oxlint)
        working-directory: ViaggiodiNozze
        run: npm run lint

      - name: Esegui Compilazione PWA (Production Build)
        working-directory: ViaggiodiNozze
        run: npm run build

      - name: Test - Versionamento & Release Consistency
        working-directory: ViaggiodiNozze
        run: node scripts/test_release_versioning.cjs

      - name: Test - LIVE P0, guestbook e GPS stale con revoca
        working-directory: ViaggiodiNozze
        run: node scripts/test_live_p0_pre_departure.cjs

      - name: Test - Guestbook D1 pubblico (nessun account)
        working-directory: ViaggiodiNozze
        run: node scripts/test_live_guest_d1.cjs

      - name: Test - Google Drive & Duplica
        working-directory: ViaggiodiNozze
        run: node scripts/test_release_166_drive_and_duplica.cjs

      - name: Test - Restyling LIVE & Auto GPS
        working-directory: ViaggiodiNozze
        run: node scripts/test_live_restyling_gps_auto.cjs

      - name: Test - Menu Altro 2x2 & UI Safe Guards
        working-directory: ViaggiodiNozze
        run: node scripts/test_ui_micro_intervention.cjs

      - name: Test - Architettura Gratuita
        working-directory: ViaggiodiNozze
        run: node scripts/test_free_architecture.cjs

      - name: Install browser test runner
        working-directory: ViaggiodiNozze
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Test - Dynamic Island / keyboard visual viewport
        working-directory: ViaggiodiNozze
        run: node scripts/test_modal_visual_viewport.cjs

      - name: Test - Retro trasporti su iPhone 15 Pro simulato
        working-directory: ViaggiodiNozze
        env:
          TRANSPORT_TEST_WIDTH: '393'
          TRANSPORT_TEST_HEIGHT: '852'
        run: node scripts/test_transport_form_subcategories.cjs

      - name: Test - Retro Aereo compatto e note scalo
        working-directory: ViaggiodiNozze
        run: node scripts/test_flight_back_1729.cjs

      - name: Test - iPad mini landscape e modalità mobile forzata
        working-directory: ViaggiodiNozze
        run: node scripts/test_ipad_mini_landscape.cjs
