name: Deploy HOUNIGO su GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, commit SHA o tag da compilare (default: main)'
        required: true
        default: 'main'
      dry_run:
        description: 'Compilazione di prova senza pubblicazione (default: ATTIVO per sicurezza)'
        type: boolean
        required: true
        default: true
      confirm:
        description: 'Digita CONFERMA per autorizzare il deploy reale su gh-pages (lascia vuoto se dry_run)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy PWA
    runs-on: ubuntu-latest

    steps:
      - name: Verifica parametri e blocco di sicurezza
        run: |
          echo "================================================================="
          echo "VERIFICA SICUREZZA WORKFLOW"
          echo "Parametri: ref='${{ inputs.ref }}', dry_run='${{ inputs.dry_run }}', confirm='${{ inputs.confirm }}'"
          echo "================================================================="
          if [ "${{ inputs.dry_run }}" = "false" ] && [ "${{ inputs.confirm }}" != "CONFERMA" ]; then
            echo "::error::DEPLOY BLOCCATO: Per effettuare un deploy reale su gh-pages devi disattivare la casella dry_run E digitare esattamente CONFERMA."
            exit 1
          fi

      - name: Checkout repository (${{ inputs.ref }})
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ViaggiodiNozze/package-lock.json'

      - name: Install dependencies
        working-directory: ViaggiodiNozze
        run: npm ci

      - name: Esegui Lint (Oxlint)
        working-directory: ViaggiodiNozze
        run: npm run lint

      - name: Test pre-volo - Versionamento
        working-directory: ViaggiodiNozze
        run: node scripts/test_release_versioning.cjs

      - name: Compilazione PWA (Production Build)
        working-directory: ViaggiodiNozze
        run: npm run build

      - name: Notifica completamento prova (Dry Run)
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "================================================================="
          echo "PROVA DI COMPILAZIONE COMPLETATA CON SUCCESSO! (DRY-RUN)"
          echo "Tutti i controlli lint, build PWA e test di versionamento sono passati."
          echo "MODALITÀ SICURA: Nessuna modifica è stata apportata al branch gh-pages."
          echo "================================================================="

      - name: Pubblica su GitHub Pages (gh-pages)
        if: ${{ inputs.dry_run == false && inputs.confirm == 'CONFERMA' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ViaggiodiNozze/dist
          clean: true
          commit-message: "deploy: HOUNIGO release da commit ${{ github.sha }} (ref: ${{ inputs.ref }})"
